[package]
name = "file_summarization"
version = "0.1.0"
edition = "2024"

[workspace]

# The published numbers come from this profile. It matches the root workspace's
# release profile, which is what a tuned user build of the Rust SDK uses.
[profile.release]
codegen-units = 1
lto = true
strip = "symbols"

[dependencies]
cocoindex = { path = "../../../rust/sdk/cocoindex" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
serde_json = "1.0"
