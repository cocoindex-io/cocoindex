<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="800" viewBox="0 220 1960 800" role="img"><title>Why CocoIndex for codebase indexing: syntax-aware chunking, incremental updates, live updates, Rust core, plain Python, consistent index and query</title><defs><marker id="ah" markerWidth="13" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 4 L0 8 Z" fill="#8A8A8A"/></marker><marker id="ahp" markerWidth="13" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L11 4 L0 8 Z" fill="#8E96FF"/></marker></defs><rect x="0" y="220" width="1960" height="800" fill="#0C0C0C"/><rect x="81" y="260" width="578" height="345" rx="16" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="119" y="318" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#8A8A8A">Chunking</text><text x="119" y="374" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#EDEDED">Syntax-aware chunking</text><text x="119" y="436" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">Chunks follow code structure, not</text><text x="119" y="477" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">line counts.</text><rect x="119" y="517" width="204.4" height="56" rx="10" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="221.2" y="545" text-anchor="middle" dominant-baseline="central" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="500" fill="#EDEDED">Tree-sitter</text><rect x="691" y="260" width="578" height="345" rx="16" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="729" y="318" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#8A8A8A">Updates</text><text x="729" y="374" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#EDEDED">Incremental updates</text><text x="729" y="436" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">Re-embed only the chunks that</text><text x="729" y="477" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">changed.</text><rect x="729" y="517" width="276.4" height="56" rx="10" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="867.2" y="545" text-anchor="middle" dominant-baseline="central" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="500" fill="#EDEDED">no full re-index</text><rect x="1301" y="260" width="578" height="345" rx="16" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><circle cx="1345" cy="318" r="6" fill="#3ECF8E"/><text x="1361" y="318" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#8A8A8A">Freshness</text><text x="1339" y="374" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#EDEDED">Live updates</text><text x="1339" y="436" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">Index refreshes as you edit.</text><rect x="1339" y="517" width="319.6" height="56" rx="10" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="1498.8" y="545" text-anchor="middle" dominant-baseline="central" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="500" fill="#EDEDED">cocoindex update -L</text><rect x="81" y="637" width="578" height="345" rx="16" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="119" y="695" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#8A8A8A">Scale</text><text x="119" y="751" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#EDEDED">Rust core</text><text x="119" y="813" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">Scales to large repos, low compute</text><text x="119" y="854" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">per change.</text><rect x="119" y="894" width="204.4" height="56" rx="10" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="221.2" y="922" text-anchor="middle" dominant-baseline="central" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="500" fill="#EDEDED">Rust engine</text><rect x="691" y="637" width="578" height="345" rx="16" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="729" y="695" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#8A8A8A">Custom</text><text x="729" y="751" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#EDEDED">Plain Python</text><text x="729" y="813" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">Swap model, store, or strategy.</text><rect x="729" y="894" width="218.8" height="56" rx="10" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="838.4" y="922" text-anchor="middle" dominant-baseline="central" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="500" fill="#EDEDED">async Python</text><rect x="1301" y="637" width="578" height="345" rx="16" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="1339" y="695" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#8A8A8A">Retrieval</text><text x="1339" y="751" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="600" fill="#EDEDED">Consistent index &amp; query</text><text x="1339" y="813" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#A1A1A1">One embedder on both paths.</text><rect x="1339" y="894" width="233.20000000000002" height="56" rx="10" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text x="1455.6" y="922" text-anchor="middle" dominant-baseline="central" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="500" fill="#EDEDED">index = query</text></svg>