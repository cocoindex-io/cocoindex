<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="351" viewBox="0 0 2000 351" role="img"><title>Podcast pipeline overview: YouTube URLs, three phases, then a SurrealDB knowledge graph</title><defs><marker id="ah" markerWidth="22" markerHeight="20" refX="17" refY="7.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L20 7.2 L0 14.4 Z" fill="#8A8A8A"/></marker></defs><rect x="0" y="0" width="2000" height="351" fill="#0C0C0C"/><rect x="17" y="87" width="245" height="175" rx="34" fill="#111111" stroke="rgba(255,255,255,0.3)" stroke-width="1.8"/><text text-anchor="middle" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="27" font-weight="500" fill="#EDEDED"><tspan x="139.5" y="134.5">YouTube URLs</tspan><tspan x="139.5" y="169.5">(text files)</tspan></text><rect x="364" y="17" width="350" height="315" rx="40" fill="#141414" stroke="rgba(255,255,255,0.4)" stroke-width="2.2"/><text text-anchor="middle" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" font-weight="600" fill="#EDEDED"><tspan x="539" y="58.0">Phase 1</tspan></text><text text-anchor="middle" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#A1A1A1"><tspan x="539" y="97.0">Per-session processing</tspan></text><line x1="390" y1="126" x2="688" y2="126" stroke="rgba(255,255,255,0.18)" stroke-width="1.6"/><text text-anchor="start" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#A1A1A1"><tspan x="400" y="157.0">Fetch transcript</tspan></text><text text-anchor="start" dominant-baseline="central" font-family="Geist, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#A1A1A1"><tspan x="400" y="186.0">Identify speakers (LLM)</tspan></text><text text-anchor="start" dom