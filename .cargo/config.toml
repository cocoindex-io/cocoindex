[build]
# This is required by tokio-console: https://docs.rs/tokio-console/latest/tokio_console
rustflags = ["--cfg", "tokio_unstable"]

# Linux arm64 links through `dev/cc_with_lld.sh`, which uses lld where it is
# installed; the script says why. A `linker` key, unlike `rustflags`, leaves
# the rustflags above in force and still applies when `RUSTFLAGS` is set in
# the environment, as CI sets it. It is in a `cfg` table so that a
# `[target.aarch64-unknown-linux-gnu]` linker in a developer's own Cargo
# config takes precedence over it.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_env = "gnu"))']
linker = "dev/cc_with_lld.sh"
