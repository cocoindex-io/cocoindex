[project]
name = "gdrive-doc-links-omnigraph"
version = "0.1.0"
description = "CocoIndex example: turn Google Docs that link to each other into a graph in Omnigraph."
requires-python = ">=3.11"
dependencies = [
    "cocoindex[google_drive,omnigraph]>=1.0.7",
]

[tool.setuptools]
py-modules = ["main"]
