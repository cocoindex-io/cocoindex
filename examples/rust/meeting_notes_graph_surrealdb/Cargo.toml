[workspace]

[package]
name = "meeting_notes_graph_surrealdb"
version = "0.1.0"
edition = "2024"

[dependencies]
# `surrealdb` is the graph target; `fastembed` + `embed_api` back the
# entity-resolution pass (local embeddings, LLM pair confirmation) and the
# structured extraction (`ApiChatClient`); `fs_live` lets `--live` watch the
# notes folder.
cocoindex = { path = "../../../rust/sdk/cocoindex", features = [
    "surrealdb",
    "fastembed",
    "embed_api",
    "fs_live",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
dotenvy = "0.15"
