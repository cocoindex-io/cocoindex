[workspace]

[package]
name = "product_recommendation"
version = "0.1.0"
edition = "2024"

[dependencies]
# `neo4j` is the graph target; `embed_api` provides `ApiChatClient`, the
# OpenAI-compatible chat client the taxonomy extraction goes through.
cocoindex = { path = "../../../rust/sdk/cocoindex", features = [
    "neo4j",
    "embed_api",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
