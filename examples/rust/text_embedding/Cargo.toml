[workspace]

[package]
name = "text_embedding"
version = "0.1.0"
edition = "2024"

[dependencies]
# `text` + `fastembed` pull in the SDK ops facades (RecursiveSplitter and the
# SentenceTransformerEmbedder) so this example no longer hand-rolls chunking or
# the fastembed plumbing. `fs_live` lets `cocoindex update -L` watch the files.
cocoindex = { path = "../../../rust/sdk/cocoindex", features = [
    "postgres",
    "text",
    "fastembed",
    "fs_live",
] }
serde = { version = "1", features = ["derive"] }
# Query path (pgvector similarity); target writes go through cocoindex::connectors::postgres.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
dotenvy = "0.15"
