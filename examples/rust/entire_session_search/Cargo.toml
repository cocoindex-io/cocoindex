[workspace]

[package]
name = "entire_session_search"
version = "0.1.0"
edition = "2024"

[dependencies]
# `postgres` is the target; `text` the chunker; `fastembed` the local
# sentence-transformer embedder; `fs_live` lets `--live` watch the checkpoints.
cocoindex = { path = "../../../rust/sdk/cocoindex", features = [
    "postgres",
    "text",
    "fastembed",
    "fs_live",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Query path (pgvector similarity); target writes go through cocoindex::connectors::postgres.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
dotenvy = "0.15"
