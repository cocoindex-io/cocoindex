[project]
name = "multi-source-knowledge-graph"
version = "0.1.0"
description = "CocoIndex example: one Neo4j knowledge graph from a Postgres component catalog, a folder of Markdown docs, and GitHub issues."
requires-python = ">=3.11"
dependencies = [
    "cocoindex[neo4j]>=1.0.7",
    "aiohttp",
    "asyncpg",
]

[tool.setuptools]
py-modules = ["main"]
