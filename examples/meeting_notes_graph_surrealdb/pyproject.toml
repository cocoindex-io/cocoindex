[project]
name = "meeting-notes-graph-surrealdb"
version = "0.1.0"
description = "CocoIndex example: build a knowledge graph from local meeting notes, stored in SurrealDB."
requires-python = ">=3.11"
dependencies = [
    "cocoindex[surrealdb,sentence_transformers,entity_resolution_llm]>=1.0.7",
    "instructor",
    "litellm",
    "pydantic",
]

[tool.setuptools]
py-modules = ["main"]
