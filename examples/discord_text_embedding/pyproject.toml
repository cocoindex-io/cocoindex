[project]
name = "discord-text-embedding-v1"
version = "0.1.0"
description = "CocoIndex v1 example: embed Discord forum posts and messages into Postgres/pgvector."
requires-python = ">=3.11"
dependencies = [
    "cocoindex[discord,postgres,sentence_transformers]>=1.2.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.4.1",
    "numpy",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
packages = []
