[project]
name = "coco-harness"
version = "0.1.0"
description = "CocoIndex example: an incremental agent harness — subagents as components, model turns as memoized functions."
requires-python = ">=3.11"
# use_state, memo_key on components and the APIs this example builds on: v1.1.0 and later.
dependencies = ["cocoindex>=1.1.0"]

[project.optional-dependencies]
llm = ["litellm!=1.107.0"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools]
packages = ["coco_harness", "coco_harness.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
