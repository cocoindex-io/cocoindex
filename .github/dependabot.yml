version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # The entries below exist only to group security updates: one pull request
  # per ecosystem, across all of its directories. `open-pull-requests-limit: 0`
  # turns off version updates for them. Security updates group only for the
  # directories listed here, so list every lockfile directory.
  - package-ecosystem: "npm"
    directories:
      - "/docs"
      - "/examples/*/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/benchmarks/*/rust"
      - "/examples/rust/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
