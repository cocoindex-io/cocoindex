name: Test Docs

# The build also reads files outside docs/: the agent skill under skills/
# (hosted at /docs/skill.md and /docs/references/), and examples/AGENTS.md and
# examples/<dir>/.env and .env.example, which docs/scripts/check-agent-output.mjs
# checks. Keep both path lists below in sync with those reads.
on:
  pull_request:
    branches: [main, v1]
    types: [opened, synchronize, reopened, ready_for_review, stacked]
    paths:
      - "docs/**"
      - "skills/**"
      - "examples/AGENTS.md"
      - "examples/*/.env"
      - "examples/*/.env.example"
      - ".github/workflows/docs_test.yml"
  push:
    branches: [main, v1]
    paths:
      - "docs/**"
      - "skills/**"
      - "examples/AGENTS.md"
      - "examples/*/.env"
      - "examples/*/.env.example"
      - ".github/workflows/docs_test.yml"
  workflow_dispatch:

# A new push to a pull request cancels its running checks. Other runs get a
# group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        run: npm --prefix docs ci
      - name: Build docs site
        run: npm --prefix docs run build
      - name: Verify docs build output exists
        run: |
          if [ ! -d "docs/dist" ]; then
            echo "Error: docs/dist directory not found after build"
            exit 1
          fi
          echo "Docs build output verified successfully"
      - name: Check for index.html in build output
        run: |
          # Find any index.html in the dist folder as verification
          if ! find docs/dist -name "index.html" -type f | grep -q .; then
            echo "Error: No index.html found in docs/dist"
            exit 1
          fi
          echo "Docs pages verified: index.html found"
