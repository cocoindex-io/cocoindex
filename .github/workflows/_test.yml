name: Run Tests (INTERNAL)

on:
    workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ephemeral runners don't need ryuk to clean up containers after the process
  # exits, and disabling it avoids a known testcontainers race where the
  # ryuk-on-8080 port mapping isn't yet visible when queried.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
    # Everything whose result depends on the Python interpreter: the
    # extension build, the workspace tests (the `rust/py` crate links
    # libpython), and the Python test suite. Runs on every (platform, Python)
    # pair. Hooks that only depend on the platform run once per platform in
    # `rust-checks` below, concurrently with this job.
    build-test:
        strategy:
            # A failing leg cancels the rest on a PR, to stop a broken change
            # early. On a push there is nothing to stop, and a cancelled leg
            # skips its Rust cache save, so the next push starts it cold.
            fail-fast: ${{ github.event_name == 'pull_request' }}
            matrix:
                platform:
                  # Standard builds (Python 3.11)
                  - { runner: ubuntu-latest, python-version: "3.11", free-threaded: false }
                  - { runner: ubuntu-24.04-arm, python-version: "3.11", free-threaded: false }
                  - { runner: macos-latest, python-version: "3.11", free-threaded: false, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: macos-15-intel, python-version: "3.11", free-threaded: false, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: windows-latest, python-version: "3.11", free-threaded: false }
                  # Free-threaded builds (Python 3.14t)
                  - { runner: ubuntu-latest, python-version: "3.14", free-threaded: true }
                  - { runner: macos-latest, python-version: "3.14", free-threaded: true, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: windows-latest, python-version: "3.14", free-threaded: true }
        runs-on: ${{ matrix.platform.runner }}
        # Healthy legs finish in 4-17 min. Without a cap, a hook that hangs
        # (nothing in the suite has an internal timeout) holds the runner until
        # GitHub's 6-hour limit while reporting nothing.
        timeout-minutes: 60
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTFLAGS: "-C debuginfo=0 ${{ matrix.platform.extra_rustflags }}"
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: "sccache"

        steps:
        # GitHub guarantees only ~14 GB free on Linux runners, and a push to a
        # release branch runs every hook over all files, so `target/` crowds
        # the root volume. `CARGO_INCREMENTAL=0` and `-C debuginfo=0` below
        # already keep `target/` as small as it gets, so the remaining headroom
        # has to come from the runner image itself. Reclaiming the preinstalled
        # runtimes we never use buys ~20 GB.
        #
        # `large-packages` is the apt-get path: it dominates this action's
        # runtime for a comparatively small win, so it stays off. `tool-cache`
        # (default false) must stay off too -- it deletes $AGENT_TOOLSDIRECTORY,
        # which is where the sccache/protoc/Python/prek steps below live.
        - name: Free disk space
          if: runner.os == 'Linux'
          uses: jlumbroso/free-disk-space@v2.0.0
          with:
            android: true
            dotnet: true
            haskell: true
            docker-images: true
            large-packages: false
            tool-cache: false

        - name: Disable Git autocrlf on Windows
          if: runner.os == 'Windows'
          shell: bash
          run: git config --global core.autocrlf false

        - uses: actions/checkout@v7
          with:
            fetch-depth: 1

        - name: Setup sccache
          uses: mozilla-actions/sccache-action@v0.0.11
          with:
            # Latest version doesn't work well because of https://github.com/mozilla/sccache/issues/2554
            version: "v0.12.0"

        - run: rustup toolchain install stable --profile minimal

        - uses: actions/setup-python@v7
          id: setup_python
          with:
            python-version: ${{ matrix.platform.python-version }}
            freethreaded: ${{ matrix.platform.free-threaded }}
            # Python cache is huge and saves little time, so disabled for now, until we have higher cache size limits
            # cache: 'pip'

        - name: Verify free-threaded interpreter
          if: matrix.platform.free-threaded
          run: |
            python -c "import sys; print(f'GIL enabled: {sys._is_gil_enabled()}'); sys.exit(1) if sys._is_gil_enabled() else None"

        - name: Setup Rust Cache
          uses: Swatinem/rust-cache@v2
          with:
            key: rust-${{ matrix.platform.runner }}-${{ steps.setup_python.outputs.python-version }}-${{ matrix.platform.free-threaded }}
            cache-targets: 'true'
            cache-all-crates: 'false'
            cache-workspace-crates: 'false'
            # Only dependency artifacts are cached (workspace crates are
            # cleaned out), and a failed test doesn't spoil those. Saving on
            # failure keeps a leg warm across a flaky run; with the default, a
            # cold leg that flakes starts cold again on the next push.
            cache-on-failure: 'true'

        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
            # setup-uv keys its cache on the Python it finds via `uv python
            # find`, which is "unknown" for a free-threaded interpreter and the
            # system Python on macOS, so without a suffix the legs share keys
            # with each other and with the e2e_type_check / fast_check jobs.
            # Whichever job saves first wins, and the uv cache is only saved
            # on a key miss, so a leg whose dependencies need building from
            # source (valkey-glide has no free-threaded wheel: 3-6 min per
            # run) never gets its built wheel persisted. One key per leg.
            cache-suffix: ${{ matrix.platform.runner }}-${{ matrix.platform.python-version }}${{ matrix.platform.free-threaded && 't' || '' }}

        - name: Sync Python dependencies
          shell: bash
          run: |
            uv sync \
              --python "$(python -c 'import sys; print(sys.executable)')" \
              --no-dev \
              --group ci \
              --no-install-project

        - name: Install prek
          uses: j178/prek-action@v2
          with:
            install-only: true

        - name: Run build-test hooks
          uses: ./.github/actions/run-prek
          env:
            UV_NO_SYNC: "1"
          with:
            # mypy-check runs in the e2e_type_check workflow. The rest are the
            # platform-only hooks that `rust-checks` runs.
            skip: mypy-check,cargo-test-sdk-features,cargo-clippy,update-rust-extern-locks,cargo-test-rust-externs,cargo-tree-sdk-no-pyo3

    # Hooks whose result depends on the platform but not on the Python
    # interpreter: the SDK's optional-features build and tests (the SDK must
    # not depend on pyo3, and a hook below enforces that), clippy, and the
    # `cargo check` of the external example/benchmark workspaces. Each ran on
    # every `build-test` leg and rebuilt the same code per interpreter; the SDK
    # all-features build alone was 2-5 min of every leg. They run here once per
    # platform instead, on one Python (clippy lints `rust/py`, which needs a
    # libpython to link against).
    #
    # Clippy and the external-workspace check run on Linux x86_64 only. The
    # lints are the same on every platform bar a few `cfg(not(unix))` lines,
    # and the external check costs 13-28 min on a cold Rust cache (every leg
    # is cold after a rustc release), which pushed the macOS Intel and Windows
    # legs past `timeout-minutes` when it ran there. The SDK's optional
    # features skip macOS Intel, the slowest runner: x86_64 is covered by
    # Linux and Darwin by the arm64 leg.
    rust-checks:
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            matrix:
                platform:
                  - { runner: ubuntu-latest }
                  - { runner: ubuntu-24.04-arm }
                  - { runner: macos-latest, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: windows-latest }
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 60
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTFLAGS: "-C debuginfo=0 ${{ matrix.platform.extra_rustflags }}"
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: "sccache"

        steps:
        # See `build-test`: the SDK all-features build plus the external
        # workspaces' `target/` need more than the ~14 GB a Linux runner has.
        - name: Free disk space
          if: runner.os == 'Linux'
          uses: jlumbroso/free-disk-space@v2.0.0
          with:
            android: true
            dotnet: true
            haskell: true
            docker-images: true
            large-packages: false
            tool-cache: false

        - name: Disable Git autocrlf on Windows
          if: runner.os == 'Windows'
          shell: bash
          run: git config --global core.autocrlf false

        - uses: actions/checkout@v7
          with:
            fetch-depth: 1

        - name: Setup sccache
          uses: mozilla-actions/sccache-action@v0.0.11
          with:
            version: "v0.12.0"

        - run: rustup toolchain install stable --profile minimal --component clippy

        # `protoc` is needed by the SDK's Qdrant feature (`qdrant-client`) and
        # by the Rust examples that enable it or LanceDB (`lance-encoding`),
        # which compile protobufs via `prost-build`. Nothing in `build-test`
        # enables those features.
        - name: Install protoc
          uses: arduino/setup-protoc@v3
          with:
            repo-token: ${{ secrets.GITHUB_TOKEN }}

        - uses: actions/setup-python@v7
          with:
            python-version: "3.11"

        - name: Setup Rust Cache
          uses: Swatinem/rust-cache@v2
          with:
            key: rust-checks-${{ matrix.platform.runner }}
            cache-targets: 'true'
            cache-all-crates: 'false'
            cache-workspace-crates: 'false'
            cache-on-failure: 'true'

        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
            cache-suffix: rust-checks-${{ matrix.platform.runner }}

        # `cargo-clippy` runs through `uv run`, so the venv has to exist.
        - name: Sync Python dependencies
          shell: bash
          run: |
            uv sync \
              --python "$(python -c 'import sys; print(sys.executable)')" \
              --no-dev \
              --group ci \
              --no-install-project

        - name: Install prek
          uses: j178/prek-action@v2
          with:
            install-only: true

        - name: Run rust-checks hooks
          uses: ./.github/actions/run-prek
          env:
            UV_NO_SYNC: "1"
          with:
            hooks: cargo-test-sdk-features cargo-tree-sdk-no-pyo3${{ matrix.platform.runner == 'ubuntu-latest' && ' cargo-clippy update-rust-extern-locks cargo-test-rust-externs' || '' }}

    validate-3p-notices:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 1
        - name: Install Rust toolchain
          uses: dtolnay/rust-toolchain@stable
        - name: Install cargo-about
          run: cargo install cargo-about --features cli --locked
        - name: Validate third-party notices (dry-run)
          shell: bash
          run: |
            set +e
            cargo about generate about.hbs > /dev/null
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error::Third-party notices validation failed. Please update /about.toml and rerun."
              exit $status
            fi
