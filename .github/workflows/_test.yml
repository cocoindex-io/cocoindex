name: Run Tests (INTERNAL)

on:
    workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ephemeral runners don't need ryuk to clean up containers after the process
  # exits, and disabling it avoids a known testcontainers race where the
  # ryuk-on-8080 port mapping isn't yet visible when queried.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
    # Everything whose result depends on the Python interpreter: the
    # extension build, the workspace tests (the `rust/py` crate links
    # libpython), and the Python test suite. Runs on every (platform, Python)
    # pair. Hooks that only depend on the platform run once per platform in
    # `rust-checks` below, concurrently with this job.
    build-test:
        strategy:
            # A failing leg cancels the rest on a PR, to stop a broken change
            # early. On a push there is nothing to stop, and a cancelled leg
            # skips its Rust cache save, so the next push starts it cold.
            fail-fast: ${{ github.event_name == 'pull_request' }}
            matrix:
                platform:
                  # Standard builds (Python 3.11)
                  - { runner: ubuntu-latest, python-version: "3.11", free-threaded: false }
                  - { runner: ubuntu-24.04-arm, python-version: "3.11", free-threaded: false }
                  - { runner: macos-latest, python-version: "3.11", free-threaded: false, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: macos-15-intel, python-version: "3.11", free-threaded: false, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: windows-latest, python-version: "3.11", free-threaded: false }
                  # Free-threaded builds (Python 3.14t)
                  - { runner: ubuntu-latest, python-version: "3.14", free-threaded: true }
                  - { runner: macos-latest, python-version: "3.14", free-threaded: true, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: windows-latest, python-version: "3.14", free-threaded: true }
        runs-on: ${{ matrix.platform.runner }}
        # Healthy legs finish in 4-17 min. Without a cap, a hook that hangs
        # (nothing in the suite has an internal timeout) holds the runner until
        # GitHub's 6-hour limit while reporting nothing.
        timeout-minutes: 60
        env:
          RUSTFLAGS: "-C debuginfo=0 ${{ matrix.platform.extra_rustflags }}"
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: "sccache"

        steps:
        # Before checkout, which writes the files with the line endings this sets.
        - name: Disable Git autocrlf on Windows
          if: runner.os == 'Windows'
          shell: bash
          run: git config --global core.autocrlf false

        - uses: actions/checkout@v7
          with:
            fetch-depth: 1

        - uses: ./.github/actions/setup-ci
          with:
            python-version: ${{ matrix.platform.python-version }}
            free-threaded: ${{ matrix.platform.free-threaded }}
            rust-cache-key: rust-${{ matrix.platform.runner }}
            rust-cache-per-python: true
            # Peak use on a 14 GiB runner: about 10 GiB, plus 0.7 GiB when
            # it saves a missed Rust cache.
            min-free-disk-gib: 20
            uv-cache-suffix: ${{ matrix.platform.runner }}-${{ matrix.platform.python-version }}${{ matrix.platform.free-threaded && 't' || '' }}

        - name: Run build-test hooks
          uses: ./.github/actions/run-prek
          env:
            UV_NO_SYNC: "1"
          with:
            # mypy-check runs in the e2e_type_check workflow. The rest are the
            # platform-only hooks that `rust-checks` runs.
            skip: mypy-check,cargo-test-sdk-features,cargo-clippy,update-rust-extern-locks,cargo-test-rust-externs,cargo-tree-sdk-no-pyo3

        # Last, so it sees every object the job's hooks compiled.
        - name: Save sccache's local cache
          if: ${{ !cancelled() }}
          uses: ./.github/actions/save-sccache

    # Hooks whose result depends on the platform but not on the Python
    # interpreter: the SDK's optional-features build and tests (the SDK must
    # not depend on pyo3, and a hook below enforces that), clippy, and the
    # `cargo check` of the external example/benchmark workspaces. Each ran on
    # every `build-test` leg and rebuilt the same code per interpreter; the SDK
    # all-features build alone was 2-5 min of every leg. They run here once per
    # platform instead.
    #
    # Clippy and the external-workspace check run on Linux x86_64 only. The
    # lints are the same on every platform bar a few `cfg(not(unix))` lines,
    # and the external check costs 13-28 min on a cold Rust cache (every leg
    # is cold after a rustc release), which pushed the macOS Intel and Windows
    # legs past `timeout-minutes` when it ran there. The SDK's optional
    # features skip macOS Intel, the slowest runner: x86_64 is covered by
    # Linux and Darwin by the arm64 leg.
    rust-checks:
        # The default name would list the matrix's hook list.
        name: rust-checks (${{ matrix.platform.runner }})
        strategy:
            fail-fast: ${{ github.event_name == 'pull_request' }}
            matrix:
                platform:
                  - runner: ubuntu-latest
                    hooks: cargo-test-sdk-features cargo-tree-sdk-no-pyo3 cargo-clippy update-rust-extern-locks cargo-test-rust-externs
                  - runner: ubuntu-24.04-arm
                    hooks: cargo-test-sdk-features cargo-tree-sdk-no-pyo3
                  - runner: macos-latest
                    extra_rustflags: "-C split-debuginfo=off"
                    hooks: cargo-test-sdk-features cargo-tree-sdk-no-pyo3
                  - runner: windows-latest
                    hooks: cargo-test-sdk-features cargo-tree-sdk-no-pyo3
        runs-on: ${{ matrix.platform.runner }}
        timeout-minutes: 60
        env:
          RUSTFLAGS: "-C debuginfo=0 ${{ matrix.platform.extra_rustflags }}"
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: "sccache"

        steps:
        - name: Disable Git autocrlf on Windows
          if: runner.os == 'Windows'
          shell: bash
          run: git config --global core.autocrlf false

        - uses: actions/checkout@v7
          with:
            fetch-depth: 1

        # Only clippy needs Python: it lints `rust/py`, which links libpython,
        # and it runs through `uv run`, so the venv has to exist. The SDK
        # hooks build nothing that touches Python (the SDK must not depend on
        # pyo3).
        - uses: ./.github/actions/setup-ci
          with:
            python-version: ${{ contains(matrix.platform.hooks, 'cargo-clippy') && '3.11' || '' }}
            rust-cache-key: rust-checks-${{ matrix.platform.runner }}
            # Peak use on a 14 GiB runner: about 18 GiB (`target/` is
            # 16 GiB), plus 2.7 GiB when it saves a missed Rust cache.
            min-free-disk-gib: 30
            uv-cache-suffix: ${{ contains(matrix.platform.hooks, 'cargo-clippy') && format('rust-checks-{0}', matrix.platform.runner) || '' }}
            clippy: ${{ contains(matrix.platform.hooks, 'cargo-clippy') }}

        - name: Run rust-checks hooks
          uses: ./.github/actions/run-prek
          env:
            UV_NO_SYNC: "1"
          with:
            hooks: ${{ matrix.platform.hooks }}

        # Last, so it sees every object the job's hooks compiled.
        - name: Save sccache's local cache
          if: ${{ !cancelled() }}
          uses: ./.github/actions/save-sccache

    validate-3p-notices:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 1
        - name: Install Rust toolchain
          uses: dtolnay/rust-toolchain@stable
        - name: Install cargo-about
          run: cargo install cargo-about --features cli --locked
        - name: Validate third-party notices (dry-run)
          shell: bash
          run: |
            set +e
            cargo about generate about.hbs > /dev/null
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error::Third-party notices validation failed. Please update /about.toml and rerun."
              exit $status
            fi
