name: Run Tests (INTERNAL)

on:
    workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Ephemeral runners don't need ryuk to clean up containers after the process
  # exits, and disabling it avoids a known testcontainers race where the
  # ryuk-on-8080 port mapping isn't yet visible when queried.
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
    # Everything whose result depends on the Python interpreter: the
    # extension build, the workspace tests (the `rust/py` crate links
    # libpython), and the Python test suite. Runs on every (platform, Python)
    # pair. Hooks that don't depend on the interpreter run once in
    # `rust-checks` below, concurrently with this job.
    build-test:
        strategy:
            # A failing leg cancels the rest on a PR or in the merge queue,
            # to stop a broken change early. On a push there is nothing to
            # stop, and a cancelled leg skips its Rust cache save, so the
            # next push starts it cold.
            fail-fast: ${{ contains(fromJSON('["pull_request", "merge_group"]'), github.event_name) }}
            matrix:
                platform:
                  # Standard builds (Python 3.11)
                  - { runner: ubuntu-latest, python-version: "3.11", free-threaded: false }
                  - { runner: ubuntu-24.04-arm, python-version: "3.11", free-threaded: false }
                  - { runner: macos-latest, python-version: "3.11", free-threaded: false, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: macos-15-intel, python-version: "3.11", free-threaded: false, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: windows-latest, python-version: "3.11", free-threaded: false }
                  # Free-threaded builds (Python 3.14t)
                  - { runner: ubuntu-latest, python-version: "3.14", free-threaded: true }
                  - { runner: macos-latest, python-version: "3.14", free-threaded: true, extra_rustflags: "-C split-debuginfo=off" }
                  - { runner: windows-latest, python-version: "3.14", free-threaded: true }
        runs-on: ${{ matrix.platform.runner }}
        # Healthy legs finish in 4-17 min. Without a cap, a hook that hangs
        # (nothing in the suite has an internal timeout) holds the runner until
        # GitHub's 6-hour limit while reporting nothing.
        timeout-minutes: 60
        env:
          RUSTFLAGS: "-C debuginfo=0 ${{ matrix.platform.extra_rustflags }}"
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: "sccache"

        steps:
        # Before checkout, which writes the files with the line endings this sets.
        - name: Disable Git autocrlf on Windows
          if: runner.os == 'Windows'
          shell: bash
          run: git config --global core.autocrlf false

        - uses: actions/checkout@v7
          with:
            fetch-depth: 1

        - uses: ./.github/actions/setup-ci
          with:
            python-version: ${{ matrix.platform.python-version }}
            free-threaded: ${{ matrix.platform.free-threaded }}
            rust-cache-key: rust-${{ matrix.platform.runner }}
            rust-cache-per-python: true
            # Peak use on a 14 GiB runner: about 10 GiB, plus 0.7 GiB when
            # it saves a missed Rust cache.
            min-free-disk-gib: 20
            uv-cache-suffix: ${{ matrix.platform.runner }}-${{ matrix.platform.python-version }}${{ matrix.platform.free-threaded && 't' || '' }}

        # The Omnigraph connector's live tests boot `omnigraph-server` on a
        # local cluster and deploy schema through the `omnigraph` CLI. They
        # gate on OMNIGRAPH_TEST_SERVER=1 and expect both binaries at
        # test/bin/v0.14.0 (git-ignored), so install the pinned release there
        # on every platform it ships for; elsewhere the live tests skip as
        # they do on a developer machine without it. They also skip while the
        # `omnigraph` Python SDK is not installed.
        - name: Install Omnigraph for the connector's live tests
          if: runner.os != 'Windows'
          shell: bash
          env:
            OMNIGRAPH_VERSION: "0.14.0"
          run: |
            case "${{ runner.os }}-${{ runner.arch }}" in
              Linux-X64)   asset=omnigraph-linux-x86_64 ;;
              Linux-ARM64) asset=omnigraph-linux-arm64 ;;
              macOS-ARM64) asset=omnigraph-macos-arm64 ;;
              *)
                echo "No Omnigraph release for ${{ runner.os }}-${{ runner.arch }}; live tests will skip"
                exit 0
                ;;
            esac
            base="https://github.com/ModernRelay/omnigraph/releases/download/v${OMNIGRAPH_VERSION}"
            dir="test/bin/v${OMNIGRAPH_VERSION}"
            mkdir -p "$dir"
            cd "$dir"
            curl -sSfL -o "$asset.tar.gz" "$base/$asset.tar.gz"
            curl -sSfL -o "$asset.sha256" "$base/$asset.sha256"
            if command -v sha256sum >/dev/null; then
              sha256sum -c "$asset.sha256"
            else
              shasum -a 256 -c "$asset.sha256"
            fi
            tar xzf "$asset.tar.gz" omnigraph omnigraph-server
            rm "$asset.tar.gz" "$asset.sha256"
            ./omnigraph version --json
            echo "OMNIGRAPH_TEST_SERVER=1" >> "$GITHUB_ENV"

        - name: Run build-test hooks
          uses: ./.github/actions/run-prek
          env:
            UV_NO_SYNC: "1"
          with:
            # mypy-check runs in the e2e_type_check workflow, and
            # update-rust-extern-locks in the fast_check one. cargo-clippy and
            # cargo-tree-sdk-no-pyo3 run in `rust-checks`. The rest are the
            # Rust SDK hooks, which `_rust_sdk.yml` runs.
            skip: mypy-check,update-rust-extern-locks,cargo-clippy,cargo-tree-sdk-no-pyo3,cargo-test-sdk,cargo-clippy-sdk,cargo-test-rust-externs

        # Last, so it sees every object the job's hooks compiled.
        - name: Save sccache's local cache
          if: ${{ !cancelled() }}
          uses: ./.github/actions/save-sccache

    # Hooks whose result doesn't depend on the Python interpreter, run once
    # instead of on every `build-test` leg: clippy, and the check that the
    # Rust SDK doesn't depend on pyo3. Linux x86_64 covers every platform for
    # both: the lints are the same on every platform bar a few
    # `cfg(not(unix))` lines, and the pyo3 check reads the dependencies of
    # every platform. The Rust SDK's own hooks run in `_rust_sdk.yml`.
    rust-checks:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        env:
          RUSTFLAGS: "-C debuginfo=0"
          CARGO_INCREMENTAL: "0"
          RUSTC_WRAPPER: "sccache"

        steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 1

        # Clippy lints `rust/py`, which links libpython, and it runs through
        # `uv run`, so the venv has to exist.
        - uses: ./.github/actions/setup-ci
          with:
            python-version: "3.11"
            rust-cache-key: rust-checks
            # Less than `build-test` uses: clippy compiles the same crates,
            # without codegen.
            min-free-disk-gib: 20
            uv-cache-suffix: rust-checks
            clippy: true

        - name: Run rust-checks hooks
          uses: ./.github/actions/run-prek
          env:
            UV_NO_SYNC: "1"
          with:
            hooks: cargo-clippy cargo-tree-sdk-no-pyo3

        # Last, so it sees every object the job's hooks compiled.
        - name: Save sccache's local cache
          if: ${{ !cancelled() }}
          uses: ./.github/actions/save-sccache

    validate-3p-notices:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 1
        - name: Install Rust toolchain
          uses: dtolnay/rust-toolchain@stable
        - name: Install cargo-about
          run: cargo install cargo-about --features cli --locked
        - name: Validate third-party notices (dry-run)
          shell: bash
          run: |
            set +e
            cargo about generate about.hbs > /dev/null
            status=$?
            if [ $status -ne 0 ]; then
              echo "::error::Third-party notices validation failed. Please update /about.toml and rerun."
              exit $status
            fi
