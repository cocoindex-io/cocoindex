name: Rust SDK Daily

# The Rust SDK isn't launched yet and its checks are slow, so CI runs them on
# no pull request and in no merge group, even for a change to the SDK: the
# local hooks are the check before a change lands. This runs them on main every
# day, to catch whatever broke the SDK, and files an issue when they fail.
# `gh workflow run rust_sdk_daily.yml --ref <branch>` runs them on a branch.
on:
  schedule:
    # An hour after CI's nightly run, so the two don't compete for runners.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust SDK's hooks: its tests under the optional features that need no
  # external server, its clippy, and the `cargo check` of the external example
  # and benchmark workspaces that build on it. The SDK doesn't depend on pyo3,
  # so no leg needs Python.
  #
  # Clippy and the external-workspace check run on Linux x86_64 only. The
  # lints are the same on every platform bar a few `cfg(not(unix))` lines,
  # and the external check costs 13-28 min on a cold Rust cache (every leg
  # is cold after a rustc release), which pushed the macOS Intel and Windows
  # legs past `timeout-minutes` when it ran there. The SDK tests skip macOS
  # Intel, the slowest runner: x86_64 is covered by Linux and Darwin by the
  # arm64 leg.
  rust-sdk:
    # The default name would list the matrix's hook list.
    name: rust-sdk (${{ matrix.platform.runner }})
    strategy:
      # Report every leg, not only the first to fail.
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            hooks: cargo-test-sdk cargo-clippy-sdk cargo-test-rust-externs
          - runner: ubuntu-24.04-arm
            hooks: cargo-test-sdk
          - runner: macos-latest
            extra_rustflags: "-C split-debuginfo=off"
            hooks: cargo-test-sdk
          - runner: windows-latest
            hooks: cargo-test-sdk
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C debuginfo=0 ${{ matrix.platform.extra_rustflags }}"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: "sccache"

    steps:
      # Before checkout, which writes the files with the line endings this sets.
      - name: Disable Git autocrlf on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-ci
        with:
          rust-cache-key: rust-sdk-${{ matrix.platform.runner }}
          # Peak use on a 14 GiB runner, measured when these hooks ran in
          # `_test.yml` together with the workspace's clippy: about 18 GiB
          # (`target/` is 16 GiB), plus 2.7 GiB when it saves a missed Rust
          # cache.
          min-free-disk-gib: 30
          clippy: ${{ contains(matrix.platform.hooks, 'cargo-clippy-sdk') }}

      - name: Test ONNX Runtime setup
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: python3 -m unittest discover -s dev/tests -p test_setup_onnxruntime.py -v

      # Use Microsoft's upstream release instead of the mirror that timed out
      # in #2625. Supply the same runtime to every SDK hook and matrix leg.
      - name: Install ONNX Runtime
        shell: bash
        run: bash dev/setup_onnxruntime.sh

      - name: Run Rust SDK hooks
        uses: ./.github/actions/run-prek
        with:
          hooks: ${{ matrix.platform.hooks }}

      # Last, so it sees every object the job's hooks compiled.
      - name: Save sccache's local cache
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-sccache

  # Files an issue when a run on main fails, or comments on the issue if one
  # is still open. A leg that runs past its timeout counts as a failure; a
  # cancelled run doesn't. A run on another branch reports only its status.
  report-failure:
    needs: rust-sdk
    if: ${{ !cancelled() && needs.rust-sdk.result != 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # `gh run view` lists the failed jobs.
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SHA: ${{ github.sha }}
      TITLE: Daily Rust SDK check failed
    steps:
      - run: |
          failed_jobs=$(gh run view "$RUN_ID" --json jobs --jq \
            '.jobs[] | select(.conclusion | IN("failure", "cancelled", "timed_out")) | "- [\(.name)](\(.url)): \(.conclusion)"')
          body=$(printf 'The [daily Rust SDK check](%s) failed on %s.\n\n%s\n' \
            "$RUN_URL" "$SHA" "$failed_jobs")
          number=$(gh issue list --state open --label "automated issue" \
            --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --label bug --label "automated issue" --body "$body"
          fi
